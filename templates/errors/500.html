{% extends "base.html" %}

{% block title %}Server Error - SkyHire{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-20 text-center space-y-6">
    <div class="w-20 h-20 rounded-3xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto shadow-sm">
        <i data-lucide="alert-octagon" class="w-10 h-10"></i>
    </div>
    <div class="space-y-2">
        <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">500</h1>
        <h2 class="text-xl font-bold text-slate-800">Something Went Wrong</h2>
        <p class="text-sm text-slate-500">An unexpected error occurred while processing your request. Please try again shortly.</p>
    </div>
    <div class="pt-2">
        <a href="{{ url_for('index') }}" class="inline-flex items-center space-x-2 px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-bold shadow-md shadow-brand-500/25 transition">
            <i data-lucide="home" class="w-4 h-4"></i>
            <span>Back to Safety</span>
        </a>
    </div>
</div>
{% endblock %}
